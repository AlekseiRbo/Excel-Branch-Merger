[project]
name = "excel-branch-merger"
version = "1.4"
description = "Desktop Python application for consolidating, validating, and deduplicating Excel reports from multiple branches."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "Pillow>=10.0,<13.0",
    "PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "mypy==2.3.0",
    "pandas-stubs==2.3.3.260113",
    "pre-commit==4.6.0",
    "pytest>=8.0,<9.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "types-openpyxl==3.1.5.20260807",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
required-version = "==0.16.0"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
files = ["src", "gui.py", "main.py"]
show_error_codes = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["src/excel_branch_merger"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80
