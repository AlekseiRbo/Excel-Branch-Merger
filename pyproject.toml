[project]
name = "excel-branch-merger"
version = "1.1"
description = "Desktop Python application for consolidating, validating, and deduplicating Excel reports from multiple branches."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "Pillow>=10.0,<13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
required-version = "==0.16.0"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP042"]
