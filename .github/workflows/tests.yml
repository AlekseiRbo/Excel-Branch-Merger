name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check gui.py main.py dev_runner.py src tests

      - name: Ruff format check
        run: uv run --locked ruff format --check gui.py main.py dev_runner.py src tests

      - name: Type check on Python 3.11
        env:
          UV_PROJECT_ENVIRONMENT: .venv-mypy311
          UV_LINK_MODE: copy
        run: |
          uv sync --locked --python 3.11
          .\.venv-mypy311\Scripts\python.exe -m mypy

      - name: Run tests
        run: uv run --locked python -m pytest -q

      - name: Compile check
        run: uv run --locked python -m compileall -q src gui.py main.py
